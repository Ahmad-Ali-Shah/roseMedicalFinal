openapi: 3.1.0
info:
  title: Rosa Medical API
  version: 0.1.0
  description: Contract 0.1 for the first public catalogue and quotation-inquiry vertical slice.
servers:
  - url: http://localhost:4000
    description: Local backend
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: rosa-medical-api
                version: 0.1.0
                timestamp: '2026-07-31T00:00:00.000Z'
  /v1/public/families:
    get:
      operationId: listPublicFamilies
      tags: [Public Catalogue]
      responses:
        '200':
          description: Published instrument families.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyListResponse'
  /v1/public/products:
    get:
      operationId: listPublicProducts
      tags: [Public Catalogue]
      parameters:
        - name: family
          in: query
          schema: { type: string }
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Published products matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  /v1/public/products/{slug}:
    get:
      operationId: getPublicProduct
      tags: [Public Catalogue]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Published product detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/public/inquiries:
    post:
      operationId: createPublicInquiry
      tags: [Public Inquiry]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryRequest'
      responses:
        '201':
          description: Inquiry stored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: The idempotency key was reused with different content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  responses:
    NotFound:
      description: Requested published record was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    LocalizedText:
      type: object
      additionalProperties: false
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: [string, 'null'] }
    MediaRef:
      type: object
      additionalProperties: false
      required: [id, url, alt, width, height]
      properties:
        id: { type: string }
        url: { type: string, format: uri-reference }
        alt: { $ref: '#/components/schemas/LocalizedText' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status: { const: ok }
        service: { const: rosa-medical-api }
        version: { type: string }
        timestamp: { type: string, format: date-time }
    FamilySummary:
      type: object
      additionalProperties: false
      required: [id, slug, name, introduction, heroImage]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        introduction: { $ref: '#/components/schemas/LocalizedText' }
        heroImage:
          oneOf:
            - $ref: '#/components/schemas/MediaRef'
            - type: 'null'
    FamilyListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FamilySummary' }
    ProductOption:
      type: object
      additionalProperties: false
      required: [id, type, label, value]
      properties:
        id: { type: string }
        type: { type: string, enum: [size, variant, direction, shape] }
        label: { $ref: '#/components/schemas/LocalizedText' }
        value: { type: string }
    ProductSummary:
      type: object
      additionalProperties: false
      required: [id, slug, code, familySlug, name, shortDescription, mainImage, optionSummary]
      properties:
        id: { type: string }
        slug: { type: string }
        code: { type: string }
        familySlug: { type: string }
        name: { $ref: '#/components/schemas/LocalizedText' }
        shortDescription: { $ref: '#/components/schemas/LocalizedText' }
        mainImage:
          oneOf:
            - $ref: '#/components/schemas/MediaRef'
            - type: 'null'
        optionSummary:
          type: array
          items: { type: string }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [gallery, options, catalogueReference]
          properties:
            gallery:
              type: array
              items: { $ref: '#/components/schemas/MediaRef' }
            options:
              type: array
              items: { $ref: '#/components/schemas/ProductOption' }
            catalogueReference:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [familySlug, page]
                  properties:
                    familySlug: { type: string }
                    page: { type: [string, 'null'] }
                - type: 'null'
    ProductListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        nextCursor: { type: [string, 'null'] }
    InquiryItemInput:
      type: object
      additionalProperties: false
      required: [productId, quantity, optionIds]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        optionIds:
          type: array
          uniqueItems: true
          items: { type: string }
        lineNote: { type: string, maxLength: 500 }
    InquiryRequest:
      type: object
      additionalProperties: false
      required: [customerName, email, telephone, country, items]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 120 }
        companyName: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        telephone: { type: string, minLength: 5, maxLength: 40 }
        country: { type: string, minLength: 2, maxLength: 100 }
        generalNotes: { type: string, maxLength: 2000 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/InquiryItemInput' }
    InquiryItemSnapshot:
      type: object
      additionalProperties: false
      required: [productId, productCode, productName, familyName, quantity, selectedOptions, lineNote]
      properties:
        productId: { type: string }
        productCode: { type: string }
        productName: { type: string }
        familyName: { type: string }
        quantity: { type: integer, minimum: 1 }
        selectedOptions:
          type: array
          items: { type: string }
        lineNote: { type: [string, 'null'] }
    InquiryResponse:
      type: object
      additionalProperties: false
      required: [reference, status, submittedAt, items]
      properties:
        reference: { type: string }
        status: { const: new }
        submittedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/InquiryItemSnapshot' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
            requestId: { type: string }
