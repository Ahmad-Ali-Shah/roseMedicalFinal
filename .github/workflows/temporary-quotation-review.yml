name: Temporary quotation review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quotation-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rosa/web exec vitest run src/test/quotation-payload.test.ts
