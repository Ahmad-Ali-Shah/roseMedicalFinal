name: Performance Micro Review

on:
  pull_request:
    branches:
      - ahmadx67676767

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - run: pnpm install --frozen-lockfile
      - name: Performance regression tests
        run: >-
          pnpm --filter @rosa/web test --
          src/test/public-performance-policy.test.ts
          src/test/catalogue-live-supabase.integration.test.ts
        env:
          RUN_LIVE_CATALOGUE_PARITY: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://hzwabrbrgcxodkqilgdi.supabase.co
