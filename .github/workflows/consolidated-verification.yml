name: Consolidated Frontend Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidated-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare verification output
        run: mkdir -p verification-results

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate contracts
        id: contracts
        continue-on-error: true
        run: pnpm contracts:generate

      - name: Check generated contract drift
        id: drift
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git diff --exit-code 2>&1 | tee verification-results/generated-drift.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee verification-results/typecheck.log

      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee verification-results/unit.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee verification-results/build.log

      - name: Foundation static test
        id: foundation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @rosa/web test:foundation 2>&1 | tee verification-results/foundation.log

      - name: Public-page styles test
        id: public_styles
        continue-on-error: true
        run: node --test apps/web/src/test/public-page-styles.static.test.mjs

      - name: F3B styles test
        id: f3b_styles
        continue-on-error: true
        run: node --test apps/web/src/test/f3b-styles.static.test.mjs

      - name: F3C styles test
        id: f3c_styles
        continue-on-error: true
        run: node --test apps/web/src/test/f3c-styles.static.test.mjs

      - name: F3D styles test
        id: f3d_styles
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test apps/web/src/test/f3d-styles.static.test.mjs 2>&1 | tee verification-results/f3d-styles.log

      - name: F3D policy test
        id: f3d_policy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test apps/web/src/test/f3d-policy.static.test.mjs 2>&1 | tee verification-results/f3d-policy.log

      - name: F3E-A styles test
        id: f3ea_styles
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-a-admin-styles.static.test.mjs

      - name: F3E-A policy test
        id: f3ea_policy
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-a-admin-policy.static.test.mjs

      - name: F3E-B styles test
        id: f3eb_styles
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-b-admin-styles.static.test.mjs

      - name: F3E-B policy test
        id: f3eb_policy
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-b-admin-policy.static.test.mjs

      - name: F3E-C styles test
        id: f3ec_styles
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-c-operations-styles.static.test.mjs

      - name: F3E-C policy test
        id: f3ec_policy
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-c-operations-policy.static.test.mjs

      - name: F3E-D styles test
        id: f3ed_styles
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-d-governance-styles.static.test.mjs

      - name: F3E-D policy test
        id: f3ed_policy
        continue-on-error: true
        run: node --test apps/web/src/test/f3e-d-governance-policy.static.test.mjs

      - name: Write core result matrix
        if: always()
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          FOUNDATION: ${{ steps.foundation.outcome }}
          PUBLIC_STYLES: ${{ steps.public_styles.outcome }}
          F3B_STYLES: ${{ steps.f3b_styles.outcome }}
          F3C_STYLES: ${{ steps.f3c_styles.outcome }}
          F3D_STYLES: ${{ steps.f3d_styles.outcome }}
          F3D_POLICY: ${{ steps.f3d_policy.outcome }}
          F3EA_STYLES: ${{ steps.f3ea_styles.outcome }}
          F3EA_POLICY: ${{ steps.f3ea_policy.outcome }}
          F3EB_STYLES: ${{ steps.f3eb_styles.outcome }}
          F3EB_POLICY: ${{ steps.f3eb_policy.outcome }}
          F3EC_STYLES: ${{ steps.f3ec_styles.outcome }}
          F3EC_POLICY: ${{ steps.f3ec_policy.outcome }}
          F3ED_STYLES: ${{ steps.f3ed_styles.outcome }}
          F3ED_POLICY: ${{ steps.f3ed_policy.outcome }}
        run: |
          cat > verification-results/core-results.txt <<EOF
          contracts=$CONTRACTS
          generated_drift=$DRIFT
          lint=$LINT
          typecheck=$TYPECHECK
          unit=$UNIT
          build=$BUILD
          foundation=$FOUNDATION
          public_styles=$PUBLIC_STYLES
          f3b_styles=$F3B_STYLES
          f3c_styles=$F3C_STYLES
          f3d_styles=$F3D_STYLES
          f3d_policy=$F3D_POLICY
          f3ea_styles=$F3EA_STYLES
          f3ea_policy=$F3EA_POLICY
          f3eb_styles=$F3EB_STYLES
          f3eb_policy=$F3EB_POLICY
          f3ec_styles=$F3EC_STYLES
          f3ec_policy=$F3EC_POLICY
          f3ed_styles=$F3ED_STYLES
          f3ed_policy=$F3ED_POLICY
          EOF
          cat verification-results/core-results.txt

      - name: Upload core verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification-evidence
          path: verification-results
          if-no-files-found: error
          retention-days: 3

      - name: Enforce core result
        if: always()
        run: |
          if grep -Ev '^[a-z0-9_]+=success$' verification-results/core-results.txt; then
            exit 1
          fi

  browser:
    name: Playwright verification
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @rosa/web exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
