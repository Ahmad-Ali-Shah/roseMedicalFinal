name: Temporary Main Frontend Sync Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-main-frontend-sync-verification
  cancel-in-progress: true

env:
  CI: "true"
  PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'temporary-verification-anon-key' }}

jobs:
  baseline-main:
    name: Baseline main core checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          node --version
          pnpm --version

      - name: Install workspace without trusting inherited lockfile
        run: pnpm install --force --no-frozen-lockfile

      - name: Report inherited lockfile regeneration
        run: git diff --stat -- pnpm-lock.yaml || true

      - id: drift
        name: Generate contracts and check drift
        continue-on-error: true
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/src/generated/schema.ts

      - id: lint
        name: Lint
        continue-on-error: true
        run: pnpm lint

      - id: typecheck
        name: Strict typecheck
        continue-on-error: true
        run: pnpm typecheck

      - id: test
        name: Unit, contract and static tests
        continue-on-error: true
        run: pnpm test

      - id: build
        name: Production build
        continue-on-error: true
        run: pnpm build

      - name: Record baseline outcomes
        run: |
          echo "### Baseline main core outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract drift: ${{ steps.drift.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Typecheck: ${{ steps.typecheck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ${{ steps.test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.build.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  synchronized-core:
    name: Synchronized branch core checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout synchronized branch
        uses: actions/checkout@v4
        with:
          ref: integration/main-frontend-f3ed-sync
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          node --version
          pnpm --version

      - name: Install workspace without trusting inherited lockfile
        run: pnpm install --force --no-frozen-lockfile

      - name: Report inherited lockfile regeneration
        run: git diff --stat -- pnpm-lock.yaml || true

      - id: drift
        name: Generate contracts and check drift
        continue-on-error: true
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/src/generated/schema.ts

      - id: lint
        name: Lint
        continue-on-error: true
        run: pnpm lint

      - id: typecheck
        name: Strict typecheck
        continue-on-error: true
        run: pnpm typecheck

      - id: test
        name: Unit, contract and static tests
        continue-on-error: true
        run: pnpm test

      - id: build
        name: Production build
        continue-on-error: true
        run: pnpm build

      - name: Record synchronized outcomes
        run: |
          echo "### Synchronized branch core outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract drift: ${{ steps.drift.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Typecheck: ${{ steps.typecheck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ${{ steps.test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.build.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  synchronized-browser:
    name: Synchronized branch browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: synchronized-core
    steps:
      - name: Checkout synchronized branch
        uses: actions/checkout@v4
        with:
          ref: integration/main-frontend-f3ed-sync
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install workspace without trusting inherited lockfile
        run: pnpm install --force --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @rosa/web exec playwright install --with-deps chromium

      - id: browser
        name: Run complete Playwright matrix
        continue-on-error: true
        run: pnpm test:e2e

      - name: Record browser outcome
        run: |
          echo "### Synchronized browser outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "- Playwright: ${{ steps.browser.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report on failure
        if: steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
