name: Canonical Catalogue Review

on:
  push:
    branches:
      - integration/canonical-catalogue-source-of-truth

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused catalogue and inquiry tests
        run: >-
          pnpm --filter @rosa/web test --
          src/test/catalogue-metadata-manifest.test.ts
          src/test/catalogue-live-mapper.test.ts
          src/test/catalogue-live-repository.test.ts
          src/test/search-catalogue.test.ts
          src/test/search-preview.test.tsx
          src/test/inquiry-store.test.ts
          src/test/quotation-payload.test.ts
          src/test/legacy-inquiry-hash.test.ts

      - name: Web typecheck
        run: pnpm --filter @rosa/web typecheck

      - name: Web lint
        run: pnpm --filter @rosa/web lint

      - name: Web build
        run: pnpm --filter @rosa/web build
        env:
          NEXT_PUBLIC_SITE_NAME: ROSA
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role
