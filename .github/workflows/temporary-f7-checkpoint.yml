name: Temporary F7 Checkpoint

on:
  pull_request:
    branches: [main]

concurrency:
  group: temporary-f7-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true

jobs:
  motion-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --reporter=append-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: lock Motion dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only
      - run: pnpm --filter @rosa/web test -- src/test/f7-motion-config.test.ts
      - run: pnpm --filter @rosa/web typecheck
