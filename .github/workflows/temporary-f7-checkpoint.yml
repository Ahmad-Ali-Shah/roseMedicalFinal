name: Temporary Final Closeout Diagnostics

on:
  pull_request:
    branches: [main]

concurrency:
  group: temporary-final-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  browser-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Collect remaining browser specs
        run: |
          mkdir -p diagnostics
          find apps/web/tests/e2e -maxdepth 1 -name '*.spec.ts' ! -name 'f7-*' ! -name '*-image-batch-01.spec.ts' -printf '%f\n' | sort > diagnostics/remaining-browser-specs.txt
          cat diagnostics/remaining-browser-specs.txt
      - name: Upload browser manifest
        uses: actions/upload-artifact@v4
        with:
          name: remaining-browser-specs
          path: diagnostics/remaining-browser-specs.txt
          if-no-files-found: error
