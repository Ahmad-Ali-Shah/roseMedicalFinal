name: Temporary F7 Checkpoint

on:
  pull_request:
    branches: [main]

concurrency:
  group: temporary-f7-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: true
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  ROSA_OWNER_EMAIL: owner@example.com

jobs:
  motion-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --reporter=append-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: lock Motion dependency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Check F7 stylesheet contract
        run: node --test apps/web/src/test/f7-premium-styles.static.test.mjs
      - name: Lint web application
        run: pnpm --filter @rosa/web lint
      - name: Test web application
        run: pnpm --filter @rosa/web test
      - name: Typecheck web application
        run: pnpm --filter @rosa/web typecheck
      - name: Build web application
        run: pnpm --filter @rosa/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @rosa/web exec playwright install --with-deps chromium
      - name: Test premium public journeys in browser
        run: pnpm --filter @rosa/web exec playwright test tests/e2e/f7-public-shell.spec.ts tests/e2e/f7-homepage-polish.spec.ts tests/e2e/f7-product-polish.spec.ts tests/e2e/f7-story-pages.spec.ts
