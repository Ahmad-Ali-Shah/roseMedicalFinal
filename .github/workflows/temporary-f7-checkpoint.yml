name: Temporary Punches Contact Sheet

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build Punches contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          source = Path('apps/web/public/media/catalogue-preview/punches')
          files = sorted(source.glob('*.webp'))
          if len(files) != 14:
              raise SystemExit(f'Expected 14 Punches WebP files, found {len(files)}')

          columns = 3
          card_w, card_h = 620, 470
          header_h = 110
          rows = (len(files) + columns - 1) // columns
          sheet = Image.new('RGB', (columns * card_w, header_h + rows * card_h), 'white')
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()
          draw.text((28, 24), 'ROSA MEDICAL — PUNCHES BATCH 01 CANDIDATE REVIEW', fill='black', font=font)
          draw.text((28, 52), '14 catalogue-backed configurations · candidate state · approve / replace per tile', fill='black', font=font)

          for index, path in enumerate(files):
              row, col = divmod(index, columns)
              x = col * card_w
              y = header_h + row * card_h
              draw.rectangle((x + 8, y + 8, x + card_w - 8, y + card_h - 8), outline='#b8b8b8', width=2)
              image = Image.open(path).convert('RGBA')
              image.thumbnail((card_w - 70, card_h - 105), Image.Resampling.LANCZOS)
              image_x = x + (card_w - image.width) // 2
              image_y = y + 24 + (card_h - 105 - image.height) // 2
              background = Image.new('RGBA', image.size, 'white')
              background.alpha_composite(image)
              sheet.paste(background.convert('RGB'), (image_x, image_y))
              label = path.stem.removeprefix('punches-').replace('-', ' ').title()
              draw.text((x + 24, y + card_h - 62), f'{index + 1:02d}. {label}', fill='black', font=font)
              draw.text((x + 24, y + card_h - 38), path.name, fill='#555555', font=font)

          output = Path('review-artifacts')
          output.mkdir(exist_ok=True)
          sheet.save(output / 'punches-batch-01-contact-sheet.jpg', quality=92, optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: punches-batch-01-contact-sheet
          path: review-artifacts/punches-batch-01-contact-sheet.jpg
          if-no-files-found: error
